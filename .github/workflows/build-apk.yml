name: Build Android APK

on:
  push:
    branches:
      - "main"
      - "master"

  pull_request:
    branches:
      - "main"
      - "master"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java
      # ============================================================
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # ============================================================
      # 3. Gradle
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # ============================================================
      # 4. Gradle Wrapper permission
      # ============================================================
      - name: Make gradlew executable
        run: chmod +x gradlew

      # ============================================================
      # 5. Android SDK verification
      #    Do NOT run: sdkmanager tools
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          echo "========================================"
          echo "Android SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager found:"
            sdkmanager --version || true
          else
            echo "sdkmanager not available in PATH."
          fi

          if command -v adb >/dev/null 2>&1; then
            echo "ADB:"
            adb --version || true
          fi

          echo "========================================"
          echo "Java"
          echo "========================================"

          java -version

      # ============================================================
      # 6. Create debug.keystore
      #
      # The project's debugConfig expects:
      # $GITHUB_WORKSPACE/debug.keystore
      #
      # This file is generated on every CI run.
      # Nothing secret is stored in GitHub.
      # ============================================================
      - name: Create Debug Keystore
        shell: bash
        run: |
          set -e

          KEYSTORE="$GITHUB_WORKSPACE/debug.keystore"

          echo "Creating debug keystore:"
          echo "$KEYSTORE"

          if [ -f "$KEYSTORE" ]; then
            echo "debug.keystore already exists."
          else
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo ""
          echo "Verifying keystore..."

          test -f "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass android

          echo ""
          echo "Debug keystore created and verified successfully."

      # ============================================================
      # 7. Show important Gradle configuration
      # ============================================================
      - name: Show Gradle Environment
        shell: bash
        run: |
          echo "========================================"
          echo "Gradle Environment"
          echo "========================================"

          ./gradlew --version

      # ============================================================
      # 8. Clean
      # ============================================================
      - name: Clean project
        run: ./gradlew clean --no-daemon

      # ============================================================
      # 9. Build Debug APK
      # ============================================================
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # ============================================================
      # 10. Verify APK
      # ============================================================
      - name: Verify APK exists
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking:"
          echo "$APK"

          test -f "$APK"

          echo ""
          echo "APK successfully created:"
          ls -lh "$APK"

      # ============================================================
      # 11. Unit Tests
      # ============================================================
      - name: Run Unit Tests
        run: ./gradlew test --stacktrace --no-daemon

      # ============================================================
      # 12. Lint
      # ============================================================
      - name: Run Lint
        run: ./gradlew lint --stacktrace --no-daemon

      # ============================================================
      # 13. Upload APK artifact
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraDownloadPro-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 14. Upload mapping files if generated
      # ============================================================
      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ai-local-test-Build-Reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

      # ============================================================
      # 15. Create GitHub Release
      # ============================================================
      - name: Create GitHub Release with APK
        if: >
          github.event_name == 'push' &&
          (
            github.ref == 'refs/heads/main' ||
            github.ref == 'refs/heads/master'
          )

        uses: softprops/action-gh-release@v2

        with:
          tag_name: v1.0.${{ github.run_number }}

          name: Ultra Download Pro v1.0.${{ github.run_number }}

          draft: false

          prerelease: false

          generate_release_notes: true

          files: |
            app/build/outputs/apk/debug/app-debug.apk

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
